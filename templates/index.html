<form method="GET" action="/" class="bg-white/10 p-4 rounded-2xl backdrop-blur-md max-w-3xl mx-auto border border-white/20 shadow-xl flex flex-col sm:flex-row gap-3">
                
                <select name="perfil" class="flex-1 bg-white text-gray-800 px-4 py-3 rounded-xl outline-none font-semibold">
                    <option value="todos" {% if perfil == 'todos' %}selected{% endif %}>Todos los perfiles</option>
                    <option value="privado" {% if perfil == 'privado' %}selected{% endif %}>Empresas Privadas</option>
                    <option value="ong" {% if perfil == 'ong' %}selected{% endif %}>ONGs / Fundaciones</option>
                    <option value="emprendimiento" {% if perfil == 'emprendimiento' %}selected{% endif %}>Emprendedores</option>
                </select>

                <select name="region" class="flex-1 bg-white text-gray-800 px-4 py-3 rounded-xl outline-none font-semibold">
                    <option value="todas" {% if region == 'todas' %}selected{% endif %}>Todas las regiones</option>
                    <option value="Metropolitana" {% if region == 'Metropolitana' %}selected{% endif %}>Metropolitana</option>
                    <option value="Valparaiso" {% if region == 'Valparaiso' %}selected{% endif %}>Valparaíso</option>
                    <option value="Biobio" {% if region == 'Biobio' %}selected{% endif %}>Biobío</option>
                    </select>

                <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-xl transition-colors">
                    Buscar
                </button>
            </form>
