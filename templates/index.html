<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta - FondosLatam</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 md:p-10 rounded-2xl shadow-xl w-full max-w-md border border-gray-100">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold text-indigo-900 tracking-tight mb-2">Crear Cuenta</h1>
            <p class="text-gray-500 text-sm">Regístrate para guardar tus filtros y recibir alertas personalizadas de fondos.</p>
        </div>

        <!-- Formulario que envía los datos a nuestra ruta en Python -->
        <form method="POST" action="/registro" class="space-y-5">
            
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Correo Electrónico</label>
                <input type="email" name="email" required class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Contraseña</label>
                <input type="password" name="password" required class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">¿Qué tipo de fondos buscas?</label>
                <select name="perfil" class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-indigo-500 outline-none">
                    <option value="emprendimiento">Emprendedores</option>
                    <option value="ong">ONGs / Fundaciones</option>
                    <option value="privado">Empresas Privadas</option>
                    <option value="investigacion">Investigación / Académico</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Tu región principal</label>
                <select name="region" class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-indigo-500 outline-none">
                    <option value="Metropolitana">Metropolitana</option>
                    <option value="Valparaiso">Valparaíso</option>
                    <option value="Biobio">Biobío</option>
                    <option value="Araucania">Araucanía</option>
                    <!-- Aquí podemos agregar el resto de regiones después -->
                </select>
            </div>

            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-xl transition-all shadow-md mt-4">
                Registrarme Gratis
            </button>
        </form>
        
        <p class="text-center text-sm text-gray-500 mt-6">
            ¿Ya tienes cuenta? <a href="#" class="text-indigo-600 font-semibold hover:underline">Inicia Sesión</a>
        </p>
    </div>

</body>
</html>
