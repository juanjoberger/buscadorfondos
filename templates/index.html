<script>
        // Esta es nuestra base de datos local de comunas (puedes agregar todas las que quieras)
        const datosUbicacion = {
            "Metropolitana": ["Santiago", "Providencia", "Maipú", "Puente Alto"],
            "Valparaiso": ["Valparaíso", "Viña del Mar", "Quilpué", "Concón"],
            "Biobio": ["Concepción", "Talcahuano", "Los Ángeles", "San Pedro de la Paz"]
        };

        function actualizarComunas() {
            const region = document.getElementById("regionSelect").value;
            const comunaSelect = document.getElementById("comunaSelect");
            
            // 1. Limpiamos las opciones anteriores
            comunaSelect.innerHTML = '<option value="todas">Todas las comunas</option>';
            
            // 2. Si la región seleccionada existe en nuestra lista, agregamos sus comunas
            if (datosUbicacion[region]) {
                datosUbicacion[region].forEach(comuna => {
                    const option = document.createElement("option");
                    option.value = comuna;
                    option.textContent = comuna;
                    comunaSelect.appendChild(option);
                });
            }
        }

        // Ejecutar la función una vez al cargar la página por si hay una región preseleccionada
        actualizarComunas();
    </script>
